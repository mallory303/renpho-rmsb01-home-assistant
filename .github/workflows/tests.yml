name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Run integration protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint integration and tests
        run: ruff check custom_components tests
      - name: Compile Python
        run: python3 -m compileall -q custom_components tests
